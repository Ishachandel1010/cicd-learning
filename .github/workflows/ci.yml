name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x app.sh test.sh
      - name: Run shell test
        run: ./test.sh

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./node-app
        run: npm install
      - name: Run Node tests
        working-directory: ./node-app
        run: node --test
